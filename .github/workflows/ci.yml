name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version` input: pnpm/action-setup reads it from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # `cache: pnpm` caches the pnpm store, keyed on the hash of pnpm-lock.yaml.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Seeded all-AI simulation: 18 preset × player-count combinations × 200 seeds (`SIM_SEEDS`
      # unset). Budget: < 10 minutes.
      - name: Simulation tests
        run: pnpm test:sim

      - name: Build
        run: pnpm build
